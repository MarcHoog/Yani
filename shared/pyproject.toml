[project]
name = "yani-shared"
version = "0.1.0"
description = "yani shared Python code: auth (JWT via JWKS, caller role and customer scoping)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yani_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
