services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-yani-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-yani-dev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ssot-api:
    build:
      context: .
      dockerfile: ssot-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-yani-dev}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
