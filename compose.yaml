services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-yani-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-yani-dev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ssot-api:
    build:
      context: .
      dockerfile: ssot-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-yani-dev}
    depends_on:
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yani-dev}
      POSTGRES_DB: yani
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yani -d yani"]
      interval: 5s
      timeout: 5s
      retries: 20

  todo-api:
    build:
      context: .
      dockerfile: todo-api/Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql://yani:${POSTGRES_PASSWORD:-yani-dev}@postgres:5432/yani
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  neo4j-data:
  postgres-data:
