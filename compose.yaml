# Auth for every API (docs/architecture.md section 2). Issuer is yani's own Zitadel below.
# `zitadel.localhost` resolves to the Zitadel container inside compose (network alias) and to
# 127.0.0.1 in browsers (*.localhost), so services and browsers see the same issuer.
# AUTH_AUDIENCE is the Zitadel project ID; `python dev.py seed` writes it to .env. The APIs refuse
# to start without it.
x-auth-env: &auth-env
  AUTH_ISSUER: http://zitadel.localhost:8081
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-yani-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-yani-dev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ssot-api:
    build:
      context: .
      dockerfile: ssot-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-yani-dev}
      <<: *auth-env
    depends_on:
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yani-dev}
      POSTGRES_DB: yani
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yani -d yani"]
      interval: 5s
      timeout: 5s
      retries: 20

  todo-api:
    build:
      context: .
      dockerfile: todo-api/Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql://yani:${POSTGRES_PASSWORD:-yani-dev}@postgres:5432/yani
      <<: *auth-env
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD:-yani-dev}
    volumes:
      - zitadel-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Identity provider: local users (password, MFA available). Microsoft/Google sign-in are added
  # later as identity providers inside Zitadel. Console: http://zitadel.localhost:8081/ui/console
  # First start creates the instance, the operator organization (yani-operators), an admin user
  # and a bootstrap service user whose token is written to .zitadel/ for `python dev.py seed`.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.17.3
    user: "${UID:-1000}"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    ports:
      - "8081:8081"
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-yani-dev-masterkey-32-characters}
      ZITADEL_PORT: 8081
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-yani-dev}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD:-yani-dev}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Built-in login UI; no separate login container.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: yani-operators
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Yani-dev-admin-1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: yani-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: yani bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
    volumes:
      - ./.zitadel:/bootstrap
    networks:
      default:
        aliases:
          - zitadel.localhost
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      zitadel-db:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - todo-api

volumes:
  neo4j-data:
  postgres-data:
  zitadel-data:
