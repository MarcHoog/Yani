# Auth for every API (docs/architecture.md section 2). Microsoft sign-in, multi-tenant: `{tid}` in
# the issuer is the token's tenant. AUTH_AUDIENCE, AUTH_OPERATOR_TENANT_ID and
# AUTH_OPERATOR_OBJECT_IDS come from .env (see .env.example); the APIs refuse to start without them.
x-auth-env: &auth-env
  AUTH_ISSUER: https://login.microsoftonline.com/{tid}/v2.0
  AUTH_JWKS_URL: https://login.microsoftonline.com/common/discovery/v2.0/keys
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
  AUTH_OPERATOR_TENANT_ID: ${AUTH_OPERATOR_TENANT_ID:-}
  AUTH_OPERATOR_OBJECT_IDS: ${AUTH_OPERATOR_OBJECT_IDS:-}

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-yani-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-yani-dev} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ssot-api:
    build:
      context: .
      dockerfile: ssot-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-yani-dev}
      TODO_API_URL: http://todo-api:8010
      <<: *auth-env
    depends_on:
      neo4j:
        condition: service_healthy
      todo-api:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yani-dev}
      POSTGRES_DB: yani
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yani -d yani"]
      interval: 5s
      timeout: 5s
      retries: 20

  todo-api:
    build:
      context: .
      dockerfile: todo-api/Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql://yani:${POSTGRES_PASSWORD:-yani-dev}@postgres:5432/yani
      <<: *auth-env
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - todo-api

volumes:
  neo4j-data:
  postgres-data:
