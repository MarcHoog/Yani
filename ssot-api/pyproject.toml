[project]
name = "ssot-api"
version = "0.1.0"
description = "yani SSOT graph API. Neo4j holds identity and relationships only."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-ulid>=3.0",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssot_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
